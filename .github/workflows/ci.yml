name: CI

on:
  push:
    branches:
      - master
      - 'dev-*'
  pull_request:

permissions:
  contents: read

jobs:
  jvm:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Run JVM tests
        run: ./gradlew :kflate:jvmTest

  multiplatform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Test JS and Wasm, compile Linux Native, and build the demo
        run: >-
          ./gradlew
          :kflate:jsNodeTest
          :kflate:wasmJsNodeTest
          :kflate:compileKotlinLinuxX64
          :web-demo:assembleWebDemo
