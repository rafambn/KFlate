name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Test benchmark scripts
        run: |
          python3 scripts/benchmark_comparison_test.py
          python3 scripts/validate_benchmark_smoke_test.py
      - name: Build JVM, Android, web, Linux, and Android Native
        run: >-
          ./gradlew
          :kflate:koverVerifyJvm
          :kflate:jvmBenchmarkSmokeBenchmark
          :kflate:linuxX64BenchmarkSmokeBenchmark
          :kflate:wasmJsBenchmarkSmokeBenchmark
          :kflate:compileAndroidMain
          :kflate:compileKotlinJs
          :kflate:compileKotlinWasmJs
          :web-demo:assembleWebDemo
          :kflate:compileKotlinLinuxX64
          :kflate:compileKotlinLinuxArm64
          :kflate:compileKotlinAndroidNativeArm32
          :kflate:compileKotlinAndroidNativeArm64
          :kflate:compileKotlinAndroidNativeX64
          :kflate:compileKotlinAndroidNativeX86

      - name: Validate benchmark smoke reports
        run: python3 scripts/validate_benchmark_smoke.py

  apple:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Build Apple targets
        run: >-
          ./gradlew
          :kflate:compileKotlinIosX64
          :kflate:compileKotlinIosArm64
          :kflate:compileKotlinIosSimulatorArm64
          :kflate:compileKotlinMacosArm64
          :kflate:compileKotlinTvosArm64
          :kflate:compileKotlinTvosSimulatorArm64
          :kflate:compileKotlinWatchosArm32
          :kflate:compileKotlinWatchosArm64
          :kflate:compileKotlinWatchosSimulatorArm64

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Build Windows target
        run: ./gradlew.bat :kflate:compileKotlinMingwX64
